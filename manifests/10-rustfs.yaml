apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
  namespace: de-hw5
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: de-hw5
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      initContainers:
        - name: make-disks
          image: busybox:1.36
          command: [sh, -c, 'for i in 1 2 3 4 5 6 7 8; do mkdir -p /data/disk$i; done; chown -R 10001:10001 /data']
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.3
          ports:
            - name: s3
              containerPort: 9000
          env:
            - name: RUSTFS_VOLUMES
              value: /data/disk{1...8}
            - name: RUSTFS_ADDRESS
              value: ':9000'
            - name: RUSTFS_STORAGE_CLASS_STANDARD
              value: 'EC:4'
            - name: RUSTFS_UNSAFE_BYPASS_DISK_CHECK
              value: 'true'
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: access-key
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: secret-key
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '2'
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-data
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: de-hw5
spec:
  selector:
    app: rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
