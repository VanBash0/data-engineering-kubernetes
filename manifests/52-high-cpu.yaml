apiVersion: v1
kind: Pod
metadata:
  name: high-cpu
  namespace: de-scheduler
spec:
  priorityClassName: de-high
  restartPolicy: Never
  containers:
    - name: wait
      image: busybox:1.36
      command: [sh, -c, 'sleep 300']
      resources:
        requests:
          cpu: '2'
          memory: 32Mi
        limits:
          cpu: '2'
          memory: 64Mi
