apiVersion: batch/v1
kind: Job
metadata:
  name: quota-second
  namespace: de-quota
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: wait
          image: busybox:1.36
          command: [sh, -c, 'sleep 300']
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 64Mi
